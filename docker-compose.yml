# Host ports are offset (5100, 5433, 6380, 5342, 8082) so PokeHub can run next to other local stacks.
services:
  pokehub.api:
    image: ${DOCKER_REGISTRY-}pokehubapi
    container_name: PokeHub.Api
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/API/PokeHub.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    # Only when the last backups ran; the API can't read the backups themselves.
    volumes:
      - pokehub-backup-status:/backup-status:ro
    ports:
      - "5100:8080"
    depends_on:
      pokehub.database:
        condition: service_healthy
      pokehub.redis:
        condition: service_healthy
      pokehub.identity:
        condition: service_healthy
      pokehub.seq:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    networks:
      - pokehub_network

  pokehub.database:
    image: postgres:17.12
    container_name: PokeHub.Database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pokehub"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    environment:
      - POSTGRES_DB=pokehub
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pokehub-database-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pokehub_network

  # Dumps the database on a schedule into a folder outside Docker (see tools/ops/README.md).
  pokehub.backup:
    image: postgres:17.12
    container_name: PokeHub.Backup
    restart: unless-stopped
    entrypoint: ["sh"]
    command: ["/ops/backup-loop.sh"]
    environment:
      - PGPASSWORD=postgres
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
    volumes:
      - ${POKEHUB_BACKUP_DIR:-${HOME}/PokeHubBackups}:/backups
      - ./tools/ops:/ops:ro
      - pokehub-backup-status:/status
    depends_on:
      pokehub.database:
        condition: service_healthy
    networks:
      - pokehub_network

  pokehub.seq:
    image: datalust/seq:2026.1.17526
    container_name: PokeHub.Seq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=True
    ports:
      - "5342:5341"
      - "8082:80"
    networks:
      - pokehub_network

  pokehub.redis:
    image: redis:7.4.12
    container_name: PokeHub.Redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6380:6379"
    networks:
      - pokehub_network

  pokehub.identity:
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: PokeHub.Identity
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    # Imports the pokehub realm from .files on first start.
    command: start-dev --import-realm
    environment:
      - KC_HEALTH_ENABLED=true
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./.containers/identity:/opt/keycloak/data
      - ./.files:/opt/keycloak/data/import
    ports:
      - "18080:8080"
      - "9000:9000"
    networks:
      - pokehub_network

networks:
  pokehub_network:
    driver: bridge

volumes:
  pokehub-database-data:
  pokehub-backup-status:
